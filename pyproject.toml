[project]
name = "atlas-dd"
version = "0.1.0"
description = "Atlas - an evaluation-driven multi-agent platform for technical due diligence"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Mrinmoy Mandal" }]
dependencies = [
    "langgraph>=1.0,<1.1",
    "langchain-core>=1.0,<2",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    # >=0.120 required: langgraph pulls starlette 1.x, which older FastAPI
    # releases cannot construct a Router against.
    "fastapi>=0.120",
    "uvicorn[standard]>=0.32",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Optional integrations. The core platform runs fully offline with the
# deterministic scripted model, so tests and demos need no API keys.
anthropic = ["langchain-anthropic>=1.0"]
mcp = ["mcp>=1.2"]
otel = [
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
    "opentelemetry-exporter-otlp-proto-http>=1.24",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.pytest.ini_options]
# `perf` is a top-level package alongside `src`, so the gate's own tests can
# import it. A performance gate that is not itself tested is a badge.
pythonpath = [".", "src"]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::PendingDeprecationWarning"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "benchmarks", "evals"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The load profile picks a random goal from a fixed list - `random` is the
# right tool for that and has nothing to do with cryptography. Locust's
# event hooks are called by the framework with untyped kwargs.
"perf/locustfile.py" = ["S311", "ANN001", "ANN003"]
# FastAPI's dependency-injection idiom is `param: T = Depends(...)`, which is
# a function call in a default argument by construction. B008 is correct in
# general and wrong here; restructuring to satisfy it would mean abandoning
# the framework's documented pattern.
"src/atlas/api/app.py" = ["B008"]
# Tests deliberately construct long literal payloads and fixtures.
"tests/*" = ["E501"]
