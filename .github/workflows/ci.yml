name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install ruff
      - run: make lint

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: make install
      - run: make test

  # Tier 1 of the eval strategy: fast behavioural smoke on every PR.
  evals-smoke:
    name: Evals (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: make install
      - run: make evals-smoke

  # Tier 2: deterministic quality and generated-result drift are merge gates.
  evals-gate:
    name: Evals (quality gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: make install
      - run: make evals
      - name: Check deterministic eval report
        run: git diff --exit-code -- evals/last_run.md
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with: { name: eval-report, path: evals/last_run.md }

  benchmark:
    name: Pattern benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: make install
      - run: make benchmark
      - run: make memory-ab
      - name: Check deterministic generated reports
        run: git diff --exit-code -- benchmarks/RESULTS.md docs/MEMORY.md
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: benchmark-results
          path: |
            benchmarks/RESULTS.md
            docs/MEMORY.md

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: pip install pip-audit
      - name: Scan repository history for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: docker build -t atlas:ci .
      - name: Snapshot and audit the deployed Python environment
        run: |
          docker run --rm -i --entrypoint python atlas:ci - \
            < scripts/list_runtime_packages.py > runtime-installed.txt
          pip-audit --strict --requirement runtime-installed.txt
      - name: Generate deployed-app CycloneDX SBOM
        run: |
          docker run --rm -i --entrypoint python atlas:ci - \
            < scripts/generate_runtime_sbom.py > sbom.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: runtime-supply-chain
          path: |
            runtime-installed.txt
            sbom.json

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: docker build -t atlas:ci .
      - name: Verify container runs as non-root
        run: |
          uid=$(docker run --rm --entrypoint id atlas:ci -u)
          echo "container uid: $uid"
          test "$uid" != "0"
      - name: Scan runtime image for high-severity vulnerabilities
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy@sha256:be1190afcb28352bfddc4ddeb71470835d16462af68d310f9f4bca710961a41e \
            image --format table --exit-code 1 --ignore-unfixed \
            --pkg-types os,library --severity CRITICAL,HIGH atlas:ci

  performance:
    name: performance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip }
      - run: make install
      - name: Latency budgets
        # Enforce coarse budgets, but never commit machine-dependent output.
        run: make perf
