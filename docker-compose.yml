# Local stack. Runs offline with the scripted model by default.
#
#   docker compose up --build
#   curl -s localhost:8000/healthz
#
# Generate an API key hash:
#   python -c "from atlas.security import hash_key; print(hash_key('my-key'))"
services:
  api:
    build: .
    ports:
      - "127.0.0.1:${ATLAS_PORT:-8000}:8000"
    environment:
      ATLAS_PROVIDER: ${ATLAS_PROVIDER:-scripted}
      # The package is pip-installed in the image, so source-relative path
      # discovery does not apply - point at the copied fixtures explicitly.
      ATLAS_FIXTURES_ROOT: /app/fixtures/repos
      ATLAS_PROJECT_ROOT: /app
      ATLAS_ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ATLAS_OTEL_ENDPOINT: ${ATLAS_OTEL_ENDPOINT:-}
      # Generated locally by `make local-config`; no reusable key is checked in.
      ATLAS_API_KEYS: ${ATLAS_API_KEYS:?Run make local-config first}
      ATLAS_AUDIT_SINK: /var/lib/atlas/audit/audit.jsonl
    volumes:
      - atlas-audit:/var/lib/atlas/audit
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  jaeger:
    image: jaegertracing/all-in-one:1.57@sha256:8f165334f418ca53691ce358c19b4244226ed35c5d18408c5acf305af2065fb9
    profiles: ["tracing"]
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"

  prometheus:
    image: prom/prometheus:v2.55.0@sha256:378f4e03703557d1c6419e6caccf922f96e6d88a530f7431d66a4c4f4b1000fe
    profiles: ["metrics"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Untracked viewer-only credential generated by `make local-config`.
      - ./observability/atlas-prometheus-token:/etc/prometheus/atlas-prometheus-token:ro
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"

volumes:
  atlas-audit:
